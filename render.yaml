services:
  - type: web
    name: biothreat-radar
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: starter        # always-on; upgrade to standard for more RAM if needed
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"       # same-origin in prod (frontend served by FastAPI); wildcard is safe for a demo
      - key: ANTHROPIC_API_KEY
        sync: false      # set this secret in the Render dashboard -- powers the AI Analyst endpoints
